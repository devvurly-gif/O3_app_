<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="6" fill="#f59e0b"/>

  <!-- Number -->
  <circle cx="540" cy="200" r="70" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="540" y="225" text-anchor="middle" fill="#fbbf24" font-size="64" font-weight="bold" font-family="Arial, sans-serif">2</text>

  <!-- Icon - box with question mark -->
  <rect x="460" y="310" width="160" height="120" rx="12" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <text x="540" y="395" text-anchor="middle" fill="#f59e0b" font-size="60" font-weight="bold" font-family="Arial, sans-serif">?</text>

  <!-- Main text -->
  <text x="540" y="530" text-anchor="middle" fill="white" font-size="42" font-weight="bold" font-family="Arial, sans-serif">Pas de suivi de stock</text>
  <text x="540" y="590" text-anchor="middle" fill="#fbbf24" font-size="42" font-weight="bold" font-family="Arial, sans-serif">en temps reel</text>

  <!-- Solution -->
  <rect x="140" y="650" width="800" height="120" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="180" y="695" fill="#22c55e" font-size="22" font-weight="bold" font-family="Arial, sans-serif">Avec O3 App :</text>
  <text x="180" y="740" fill="rgba(255,255,255,0.9)" font-size="22" font-family="Arial, sans-serif">Alertes automatiques quand le stock est bas</text>

  <!-- Dots -->
  <circle cx="490" cy="870" r="6" fill="rgba(255,255,255,0.3)"/>
  <circle cx="510" cy="870" r="6" fill="rgba(255,255,255,0.3)"/>
  <circle cx="530" cy="870" r="6" fill="white"/>
  <circle cx="550" cy="870" r="6" fill="rgba(255,255,255,0.3)"/>
  <circle cx="570" cy="870" r="6" fill="rgba(255,255,255,0.3)"/>
  <circle cx="590" cy="870" r="6" fill="rgba(255,255,255,0.3)"/>

  <rect x="0" y="1074" width="1080" height="6" fill="#f59e0b"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative elements -->
  <circle cx="1100" cy="80" r="180" fill="rgba(255,255,255,0.04)"/>
  <circle cx="1000" cy="200" r="120" fill="rgba(255,255,255,0.03)"/>
  <circle cx="100" cy="550" r="140" fill="rgba(255,255,255,0.04)"/>

  <!-- Grid dots pattern -->
  <g fill="rgba(255,255,255,0.06)">
    <circle cx="700" cy="50" r="3"/><circle cx="740" cy="50" r="3"/><circle cx="780" cy="50" r="3"/><circle cx="820" cy="50" r="3"/>
    <circle cx="700" cy="90" r="3"/><circle cx="740" cy="90" r="3"/><circle cx="780" cy="90" r="3"/><circle cx="820" cy="90" r="3"/>
    <circle cx="700" cy="130" r="3"/><circle cx="740" cy="130" r="3"/><circle cx="780" cy="130" r="3"/><circle cx="820" cy="130" r="3"/>
  </g>

  <!-- Logo -->
  <circle cx="100" cy="70" r="35" fill="white"/>
  <text x="100" y="82" text-anchor="middle" fill="#2563eb" font-size="28" font-weight="bold" font-family="Arial, sans-serif">O3</text>

  <!-- Emoji-style icon -->
  <text x="90" y="210" font-size="50" font-family="Arial">&#x1F4CA;</text>

  <!-- Main headline -->
  <text x="90" y="290" fill="white" font-size="48" font-weight="bold" font-family="Arial, sans-serif">Vous gerez encore</text>
  <text x="90" y="350" fill="white" font-size="48" font-weight="bold" font-family="Arial, sans-serif">votre entreprise</text>
  <text x="90" y="410" fill="#fbbf24" font-size="48" font-weight="bold" font-family="Arial, sans-serif">avec Excel ?</text>

  <!-- Feature pills -->
  <rect x="90" y="440" width="140" height="36" rx="18" fill="rgba(255,255,255,0.15)"/>
  <text x="160" y="464" text-anchor="middle" fill="white" font-size="14" font-family="Arial, sans-serif">Ventes</text>

  <rect x="245" y="440" width="140" height="36" rx="18" fill="rgba(255,255,255,0.15)"/>
  <text x="315" y="464" text-anchor="middle" fill="white" font-size="14" font-family="Arial, sans-serif">Achats</text>

  <rect x="400" y="440" width="140" height="36" rx="18" fill="rgba(255,255,255,0.15)"/>
  <text x="470" y="464" text-anchor="middle" fill="white" font-size="14" font-family="Arial, sans-serif">Stock</text>

  <rect x="555" y="440" width="140" height="36" rx="18" fill="rgba(255,255,255,0.15)"/>
  <text x="625" y="464" text-anchor="middle" fill="white" font-size="14" font-family="Arial, sans-serif">Facturation</text>

  <rect x="710" y="440" width="140" height="36" rx="18" fill="rgba(255,255,255,0.15)"/>
  <text x="780" y="464" text-anchor="middle" fill="white" font-size="14" font-family="Arial, sans-serif">POS</text>

  <!-- CTA Button -->
  <rect x="90" y="510" width="380" height="56" rx="28" fill="#f59e0b"/>
  <text x="280" y="546" text-anchor="middle" fill="#1e3a8a" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Essai gratuit 14 jours</text>

  <!-- Right side - Mock dashboard -->
  <rect x="750" y="180" width="380" height="280" rx="16" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Dashboard header -->
  <rect x="750" y="180" width="380" height="45" rx="16" fill="rgba(255,255,255,0.08)"/>
  <circle cx="775" cy="203" r="6" fill="#ef4444"/>
  <circle cx="795" cy="203" r="6" fill="#f59e0b"/>
  <circle cx="815" cy="203" r="6" fill="#22c55e"/>
  <text x="940" y="208" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="12" font-family="Arial, sans-serif">O3 App Dashboard</text>

  <!-- Mini chart bars -->
  <rect x="785" y="350" width="30" height="80" rx="4" fill="rgba(255,255,255,0.2)"/>
  <rect x="825" y="310" width="30" height="120" rx="4" fill="rgba(255,255,255,0.25)"/>
  <rect x="865" y="330" width="30" height="100" rx="4" fill="rgba(255,255,255,0.2)"/>
  <rect x="905" y="280" width="30" height="150" rx="4" fill="#f59e0b" opacity="0.7"/>
  <rect x="945" y="300" width="30" height="130" rx="4" fill="rgba(255,255,255,0.25)"/>
  <rect x="985" y="340" width="30" height="90" rx="4" fill="rgba(255,255,255,0.2)"/>
  <rect x="1025" y="260" width="30" height="170" rx="4" fill="rgba(255,255,255,0.3)"/>

  <!-- KPI boxes -->
  <rect x="785" y="240" width="155" height="50" rx="8" fill="rgba(255,255,255,0.08)"/>
  <text x="800" y="258" fill="rgba(255,255,255,0.5)" font-size="10" font-family="Arial, sans-serif">Chiffre d'affaires</text>
  <text x="800" y="280" fill="white" font-size="16" font-weight="bold" font-family="Arial, sans-serif">125,400 MAD</text>

  <rect x="955" y="240" width="155" height="50" rx="8" fill="rgba(255,255,255,0.08)"/>
  <text x="970" y="258" fill="rgba(255,255,255,0.5)" font-size="10" font-family="Arial, sans-serif">Commandes</text>
  <text x="970" y="280" fill="#22c55e" font-size="16" font-weight="bold" font-family="Arial, sans-serif">+34 aujourd'hui</text>

  <!-- URL -->
  <text x="940" y="500" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="16" font-family="Arial, sans-serif">o3app.ma</text>
</svg>

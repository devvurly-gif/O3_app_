<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="6" fill="#f59e0b"/>

  <!-- Number -->
  <circle cx="540" cy="200" r="70" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="540" y="225" text-anchor="middle" fill="#fbbf24" font-size="64" font-weight="bold" font-family="Arial, sans-serif">4</text>

  <!-- Icon - chart going up -->
  <g transform="translate(440, 300)">
    <rect x="0" y="100" width="40" height="60" rx="6" fill="rgba(255,255,255,0.15)"/>
    <rect x="55" y="70" width="40" height="90" rx="6" fill="rgba(255,255,255,0.2)"/>
    <rect x="110" y="40" width="40" height="120" rx="6" fill="rgba(255,255,255,0.25)"/>
    <rect x="165" y="10" width="40" height="150" rx="6" fill="#f59e0b" opacity="0.7"/>
    <!-- Question marks above bars -->
    <text x="20" y="90" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="24" font-family="Arial">?</text>
    <text x="75" y="60" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="24" font-family="Arial">?</text>
    <text x="130" y="30" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="24" font-family="Arial">?</text>
  </g>

  <!-- Main text -->
  <text x="540" y="550" text-anchor="middle" fill="white" font-size="38" font-weight="bold" font-family="Arial, sans-serif">Aucune vue d'ensemble sur</text>
  <text x="540" y="610" text-anchor="middle" fill="#fbbf24" font-size="38" font-weight="bold" font-family="Arial, sans-serif">votre chiffre d'affaires</text>

  <!-- Solution -->
  <rect x="140" y="670" width="800" height="120" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="180" y="715" fill="#22c55e" font-size="22" font-weight="bold" font-family="Arial, sans-serif">Avec O3 App :</text>
  <text x="180" y="760" fill="rgba(255,255,255,0.9)" font-size="22" font-family="Arial, sans-serif">Dashboard avec KPIs et graphiques en temps reel</text>

  <!-- Dots -->
  <circle cx="490" cy="870" r="6" fill="rgba(255,255,255,0.3)"/>
  <circle cx="510" cy="870" r="6" fill="rgba(255,255,255,0.3)"/>
  <circle cx="530" cy="870" r="6" fill="rgba(255,255,255,0.3)"/>
  <circle cx="550" cy="870" r="6" fill="rgba(255,255,255,0.3)"/>
  <circle cx="570" cy="870" r="6" fill="white"/>
  <circle cx="590" cy="870" r="6" fill="rgba(255,255,255,0.3)"/>

  <rect x="0" y="1074" width="1080" height="6" fill="#f59e0b"/>
</svg>

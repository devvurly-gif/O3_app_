<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Sparkle decorations -->
  <g fill="#f59e0b" opacity="0.3">
    <polygon points="200,100 210,130 240,130 215,150 225,180 200,160 175,180 185,150 160,130 190,130" transform="scale(0.6)"/>
    <polygon points="900,150 910,180 940,180 915,200 925,230 900,210 875,230 885,200 860,180 890,180" transform="scale(0.5)"/>
    <polygon points="150,800 160,830 190,830 165,850 175,880 150,860 125,880 135,850 110,830 140,830" transform="scale(0.5)"/>
    <polygon points="950,750 960,780 990,780 965,800 975,830 950,810 925,830 935,800 910,780 940,780" transform="scale(0.4)"/>
  </g>

  <!-- Top badge -->
  <rect x="290" y="80" width="500" height="60" rx="30" fill="url(#gold)"/>
  <text x="540" y="118" text-anchor="middle" fill="#1e3a8a" font-size="24" font-weight="bold" font-family="Arial, sans-serif">OFFRE DE LANCEMENT</text>

  <!-- Logo -->
  <circle cx="540" cy="240" r="55" fill="white"/>
  <text x="540" y="258" text-anchor="middle" fill="#2563eb" font-size="44" font-weight="bold" font-family="Arial, sans-serif">O3</text>

  <!-- Headline -->
  <text x="540" y="370" text-anchor="middle" fill="white" font-size="42" font-weight="bold" font-family="Arial, sans-serif">Les 50 premiers inscrits</text>
  <text x="540" y="425" text-anchor="middle" fill="#fbbf24" font-size="42" font-weight="bold" font-family="Arial, sans-serif">beneficient de :</text>

  <!-- Benefits -->
  <rect x="140" y="480" width="800" height="280" rx="24" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <g font-family="Arial, sans-serif">
    <!-- Benefit 1 -->
    <circle cx="200" cy="535" r="20" fill="rgba(34,197,94,0.2)" stroke="#22c55e" stroke-width="2"/>
    <text x="200" y="542" text-anchor="middle" fill="#22c55e" font-size="20" font-weight="bold">1</text>
    <text x="240" y="530" fill="white" font-size="22" font-weight="bold">1 mois GRATUIT</text>
    <text x="240" y="555" fill="rgba(255,255,255,0.6)" font-size="16">au lieu de 14 jours d'essai</text>

    <!-- Benefit 2 -->
    <circle cx="200" cy="615" r="20" fill="rgba(34,197,94,0.2)" stroke="#22c55e" stroke-width="2"/>
    <text x="200" y="622" text-anchor="middle" fill="#22c55e" font-size="20" font-weight="bold">2</text>
    <text x="240" y="610" fill="white" font-size="22" font-weight="bold">Configuration assistee</text>
    <text x="240" y="635" fill="rgba(255,255,255,0.6)" font-size="16">offerte par notre equipe</text>

    <!-- Benefit 3 -->
    <circle cx="200" cy="700" r="20" fill="rgba(34,197,94,0.2)" stroke="#22c55e" stroke-width="2"/>
    <text x="200" y="707" text-anchor="middle" fill="#22c55e" font-size="20" font-weight="bold">3</text>
    <text x="240" y="695" fill="white" font-size="22" font-weight="bold">Support prioritaire</text>
    <text x="240" y="720" fill="rgba(255,255,255,0.6)" font-size="16">pendant 3 mois</text>
  </g>

  <!-- Urgency -->
  <rect x="290" y="810" width="500" height="55" rx="28" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1"/>
  <text x="540" y="845" text-anchor="middle" fill="#fca5a5" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Places limitees — Ne manquez pas !</text>

  <!-- CTA -->
  <rect x="240" y="900" width="600" height="70" rx="35" fill="#f59e0b"/>
  <text x="540" y="944" text-anchor="middle" fill="#1e3a8a" font-size="26" font-weight="bold" font-family="Arial, sans-serif">S'inscrire maintenant</text>

  <!-- URL -->
  <text x="540" y="1020" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="20" font-family="Arial, sans-serif">o3app.ma/register</text>
</svg>

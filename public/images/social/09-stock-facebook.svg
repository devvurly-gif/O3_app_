<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Logo -->
  <circle cx="100" cy="70" r="35" fill="white"/>
  <text x="100" y="82" text-anchor="middle" fill="#2563eb" font-size="28" font-weight="bold" font-family="Arial, sans-serif">O3</text>

  <!-- Headline -->
  <text x="90" y="200" fill="white" font-size="50" font-weight="bold" font-family="Arial, sans-serif">Rupture de stock ?</text>
  <text x="90" y="265" fill="#fbbf24" font-size="50" font-weight="bold" font-family="Arial, sans-serif">Plus jamais.</text>

  <!-- Features -->
  <g fill="rgba(255,255,255,0.85)" font-size="20" font-family="Arial, sans-serif">
    <circle cx="110" cy="330" r="5" fill="#22c55e"/>
    <text x="130" y="337">Mise a jour automatique du stock</text>

    <circle cx="110" cy="370" r="5" fill="#22c55e"/>
    <text x="130" y="377">Alertes de stock minimum</text>

    <circle cx="110" cy="410" r="5" fill="#22c55e"/>
    <text x="130" y="417">Multi-entrepots</text>

    <circle cx="110" cy="450" r="5" fill="#22c55e"/>
    <text x="130" y="457">Historique des mouvements</text>

    <circle cx="110" cy="490" r="5" fill="#22c55e"/>
    <text x="130" y="497">Inventaire simplifie</text>
  </g>

  <!-- CTA -->
  <rect x="90" y="530" width="340" height="56" rx="28" fill="#f59e0b"/>
  <text x="260" y="566" text-anchor="middle" fill="#1e3a8a" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Essai gratuit 14 jours</text>

  <!-- Right side - Stock visualization -->
  <rect x="680" y="120" width="440" height="400" rx="20" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Title -->
  <text x="900" y="165" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="16" font-family="Arial, sans-serif">Etat du Stock</text>

  <!-- Stock items -->
  <rect x="720" y="190" width="360" height="55" rx="10" fill="rgba(255,255,255,0.05)"/>
  <text x="740" y="215" fill="rgba(255,255,255,0.7)" font-size="14" font-family="Arial, sans-serif">iPhone 15 Pro</text>
  <rect x="740" y="225" width="200" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="740" y="225" width="160" height="8" rx="4" fill="#22c55e"/>
  <text x="1040" y="222" text-anchor="end" fill="#22c55e" font-size="14" font-weight="bold" font-family="Arial, sans-serif">80%</text>

  <rect x="720" y="260" width="360" height="55" rx="10" fill="rgba(255,255,255,0.05)"/>
  <text x="740" y="285" fill="rgba(255,255,255,0.7)" font-size="14" font-family="Arial, sans-serif">Galaxy S24</text>
  <rect x="740" y="295" width="200" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="740" y="295" width="120" height="8" rx="4" fill="#f59e0b"/>
  <text x="1040" y="292" text-anchor="end" fill="#f59e0b" font-size="14" font-weight="bold" font-family="Arial, sans-serif">60%</text>

  <rect x="720" y="330" width="360" height="55" rx="10" fill="rgba(255,255,255,0.05)"/>
  <text x="740" y="355" fill="rgba(255,255,255,0.7)" font-size="14" font-family="Arial, sans-serif">AirPods Pro</text>
  <rect x="740" y="365" width="200" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="740" y="365" width="40" height="8" rx="4" fill="#ef4444"/>
  <text x="1040" y="362" text-anchor="end" fill="#ef4444" font-size="14" font-weight="bold" font-family="Arial, sans-serif">20%</text>

  <!-- Alert -->
  <rect x="720" y="405" width="360" height="50" rx="10" fill="rgba(239,68,68,0.1)" stroke="rgba(239,68,68,0.3)" stroke-width="1"/>
  <text x="745" y="436" fill="#fca5a5" font-size="14" font-family="Arial, sans-serif">Alerte : AirPods Pro — Stock bas !</text>

  <!-- Summary -->
  <rect x="720" y="470" width="170" height="40" rx="8" fill="rgba(255,255,255,0.06)"/>
  <text x="805" y="496" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Arial, sans-serif">156 produits</text>

  <rect x="905" y="470" width="170" height="40" rx="8" fill="rgba(255,255,255,0.06)"/>
  <text x="990" y="496" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Arial, sans-serif">3 entrepots</text>

  <!-- URL -->
  <text x="900" y="560" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="16" font-family="Arial, sans-serif">o3app.ma</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="100" r="200" fill="rgba(255,255,255,0.04)"/>

  <!-- Logo -->
  <circle cx="100" cy="70" r="35" fill="white"/>
  <text x="100" y="82" text-anchor="middle" fill="#2563eb" font-size="28" font-weight="bold" font-family="Arial, sans-serif">O3</text>

  <!-- Headline -->
  <text x="90" y="220" fill="white" font-size="52" font-weight="bold" font-family="Arial, sans-serif">Votre caisse</text>
  <text x="90" y="285" fill="#fbbf24" font-size="52" font-weight="bold" font-family="Arial, sans-serif">dans votre poche.</text>

  <!-- Features -->
  <g fill="rgba(255,255,255,0.85)" font-size="20" font-family="Arial, sans-serif">
    <circle cx="110" cy="350" r="5" fill="#22c55e"/>
    <text x="130" y="357">Scan produits par code-barres</text>

    <circle cx="110" cy="390" r="5" fill="#22c55e"/>
    <text x="130" y="397">Paiement multi-mode</text>

    <circle cx="110" cy="430" r="5" fill="#22c55e"/>
    <text x="130" y="437">Ticket de caisse automatique</text>

    <circle cx="110" cy="470" r="5" fill="#22c55e"/>
    <text x="130" y="477">Synchronisation stock temps reel</text>
  </g>

  <!-- CTA -->
  <rect x="90" y="520" width="340" height="56" rx="28" fill="#f59e0b"/>
  <text x="260" y="556" text-anchor="middle" fill="#1e3a8a" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Decouvrir le POS</text>

  <!-- Right side - Tablet POS mockup -->
  <rect x="700" y="120" width="420" height="380" rx="24" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- Screen -->
  <rect x="720" y="140" width="380" height="320" rx="12" fill="rgba(0,0,0,0.2)"/>
  <!-- POS grid -->
  <rect x="740" y="160" width="100" height="80" rx="8" fill="rgba(255,255,255,0.1)"/>
  <text x="790" y="210" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="14" font-family="Arial, sans-serif">iPhone 15</text>

  <rect x="855" y="160" width="100" height="80" rx="8" fill="rgba(255,255,255,0.1)"/>
  <text x="905" y="210" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="14" font-family="Arial, sans-serif">Galaxy S24</text>

  <rect x="970" y="160" width="100" height="80" rx="8" fill="rgba(255,255,255,0.1)"/>
  <text x="1020" y="210" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="14" font-family="Arial, sans-serif">Airpods</text>

  <rect x="740" y="255" width="100" height="80" rx="8" fill="rgba(255,255,255,0.1)"/>
  <text x="790" y="305" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="14" font-family="Arial, sans-serif">Cable USB</text>

  <rect x="855" y="255" width="100" height="80" rx="8" fill="#f59e0b" opacity="0.4"/>
  <text x="905" y="305" text-anchor="middle" fill="white" font-size="14" font-family="Arial, sans-serif">Coque</text>

  <rect x="970" y="255" width="100" height="80" rx="8" fill="rgba(255,255,255,0.1)"/>
  <text x="1020" y="305" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="14" font-family="Arial, sans-serif">Chargeur</text>

  <!-- Total bar -->
  <rect x="740" y="370" width="330" height="70" rx="10" fill="rgba(255,255,255,0.08)"/>
  <text x="760" y="400" fill="rgba(255,255,255,0.5)" font-size="14" font-family="Arial, sans-serif">TOTAL</text>
  <text x="760" y="425" fill="white" font-size="22" font-weight="bold" font-family="Arial, sans-serif">1,250.00 MAD</text>
  <rect x="960" y="380" width="100" height="50" rx="10" fill="#22c55e"/>
  <text x="1010" y="412" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="Arial, sans-serif">Payer</text>

  <!-- URL -->
  <text x="910" y="550" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="16" font-family="Arial, sans-serif">o3app.ma</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="6" fill="#f59e0b"/>

  <!-- Decorative -->
  <circle cx="900" cy="200" r="250" fill="rgba(255,255,255,0.03)"/>
  <circle cx="180" cy="880" r="200" fill="rgba(255,255,255,0.03)"/>

  <!-- Logo big -->
  <circle cx="540" cy="280" r="90" fill="white"/>
  <text x="540" y="310" text-anchor="middle" fill="#2563eb" font-size="72" font-weight="bold" font-family="Arial, sans-serif">O3</text>

  <!-- Tagline -->
  <text x="540" y="440" text-anchor="middle" fill="white" font-size="38" font-weight="bold" font-family="Arial, sans-serif">Gerez votre entreprise</text>
  <text x="540" y="500" text-anchor="middle" fill="#fbbf24" font-size="48" font-weight="bold" font-family="Arial, sans-serif">simplement.</text>

  <!-- Features row -->
  <text x="540" y="580" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="22" font-family="Arial, sans-serif">Ventes  ·  Achats  ·  Stock  ·  POS  ·  Facturation</text>

  <!-- CTA Button -->
  <rect x="290" y="650" width="500" height="80" rx="40" fill="#f59e0b"/>
  <text x="540" y="700" text-anchor="middle" fill="#1e3a8a" font-size="28" font-weight="bold" font-family="Arial, sans-serif">Essai gratuit 14 jours</text>

  <!-- URL -->
  <text x="540" y="790" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="24" font-family="Arial, sans-serif">o3app.ma</text>

  <!-- Badge -->
  <rect x="340" y="840" width="400" height="50" rx="25" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="540" y="872" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="18" font-family="Arial, sans-serif">ERP Cloud 100% Marocain</text>

  <!-- Dots -->
  <circle cx="490" cy="960" r="6" fill="rgba(255,255,255,0.3)"/>
  <circle cx="510" cy="960" r="6" fill="rgba(255,255,255,0.3)"/>
  <circle cx="530" cy="960" r="6" fill="rgba(255,255,255,0.3)"/>
  <circle cx="550" cy="960" r="6" fill="rgba(255,255,255,0.3)"/>
  <circle cx="570" cy="960" r="6" fill="rgba(255,255,255,0.3)"/>
  <circle cx="590" cy="960" r="6" fill="white"/>

  <rect x="0" y="1074" width="1080" height="6" fill="#f59e0b"/>
</svg>

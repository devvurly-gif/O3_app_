<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="6" fill="#f59e0b"/>

  <!-- Decorative -->
  <circle cx="900" cy="200" r="250" fill="rgba(255,255,255,0.03)"/>
  <circle cx="180" cy="880" r="200" fill="rgba(255,255,255,0.03)"/>

  <!-- Big quote mark -->
  <text x="150" y="350" fill="rgba(255,255,255,0.08)" font-size="300" font-family="Georgia, serif">"</text>

  <!-- Quote text -->
  <text x="540" y="420" text-anchor="middle" fill="white" font-size="36" font-weight="bold" font-family="Georgia, serif" font-style="italic">La meilleure facon de</text>
  <text x="540" y="475" text-anchor="middle" fill="white" font-size="36" font-weight="bold" font-family="Georgia, serif" font-style="italic">predire l'avenir de</text>
  <text x="540" y="530" text-anchor="middle" fill="white" font-size="36" font-weight="bold" font-family="Georgia, serif" font-style="italic">votre entreprise,</text>
  <text x="540" y="610" text-anchor="middle" fill="#fbbf24" font-size="36" font-weight="bold" font-family="Georgia, serif" font-style="italic">c'est de bien gerer</text>
  <text x="540" y="665" text-anchor="middle" fill="#fbbf24" font-size="36" font-weight="bold" font-family="Georgia, serif" font-style="italic">son present.</text>

  <!-- Separator -->
  <rect x="480" y="720" width="120" height="3" fill="#f59e0b"/>

  <!-- Logo -->
  <circle cx="540" cy="810" r="40" fill="white"/>
  <text x="540" y="824" text-anchor="middle" fill="#2563eb" font-size="32" font-weight="bold" font-family="Arial, sans-serif">O3</text>

  <!-- Brand -->
  <text x="540" y="890" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="20" font-family="Arial, sans-serif">O3 App — o3app.ma</text>

  <rect x="0" y="1074" width="1080" height="6" fill="#f59e0b"/>

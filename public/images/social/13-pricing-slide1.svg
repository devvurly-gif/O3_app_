<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="6" fill="#f59e0b"/>

  <!-- Logo -->
  <circle cx="540" cy="150" r="50" fill="white"/>
  <text x="540" y="168" text-anchor="middle" fill="#2563eb" font-size="40" font-weight="bold" font-family="Arial, sans-serif">O3</text>

  <!-- Title -->
  <text x="540" y="290" text-anchor="middle" fill="white" font-size="46" font-weight="bold" font-family="Arial, sans-serif">Quel plan O3 App</text>
  <text x="540" y="355" text-anchor="middle" fill="#fbbf24" font-size="46" font-weight="bold" font-family="Arial, sans-serif">est fait pour vous ?</text>

  <!-- 3 plan previews -->
  <!-- Starter -->
  <rect x="100" y="440" width="260" height="360" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="230" y="490" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="16" font-family="Arial, sans-serif">STARTER</text>
  <text x="230" y="545" text-anchor="middle" fill="white" font-size="42" font-weight="bold" font-family="Arial, sans-serif">499</text>
  <text x="230" y="575" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="16" font-family="Arial, sans-serif">MAD / mois</text>
  <line x1="150" y1="600" x2="310" y2="600" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="230" y="635" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="15" font-family="Arial, sans-serif">Ventes</text>
  <text x="230" y="665" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="15" font-family="Arial, sans-serif">Stock</text>
  <text x="230" y="695" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="15" font-family="Arial, sans-serif">1 entrepot</text>
  <text x="230" y="725" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="15" font-family="Arial, sans-serif">Sous-domaine gratuit</text>
  <text x="230" y="775" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" font-style="italic" font-family="Arial, sans-serif">Ideal pour demarrer</text>

  <!-- Business (highlighted) -->
  <rect x="410" y="420" width="260" height="400" rx="20" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="2"/>
  <rect x="460" y="430" width="160" height="28" rx="14" fill="#f59e0b"/>
  <text x="540" y="450" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="bold" font-family="Arial, sans-serif">POPULAIRE</text>
  <text x="540" y="500" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="16" font-family="Arial, sans-serif">BUSINESS</text>
  <text x="540" y="555" text-anchor="middle" fill="white" font-size="42" font-weight="bold" font-family="Arial, sans-serif">999</text>
  <text x="540" y="585" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="16" font-family="Arial, sans-serif">MAD / mois</text>
  <line x1="460" y1="610" x2="620" y2="610" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="540" y="645" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="15" font-family="Arial, sans-serif">Ventes + Achats</text>
  <text x="540" y="675" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="15" font-family="Arial, sans-serif">POS</text>
  <text x="540" y="705" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="15" font-family="Arial, sans-serif">Multi-entrepots</text>
  <text x="540" y="735" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="15" font-family="Arial, sans-serif">Domaine personnalise</text>
  <text x="540" y="795" text-anchor="middle" fill="#f59e0b" font-size="14" font-style="italic" font-family="Arial, sans-serif">Pour la croissance</text>

  <!-- Enterprise -->
  <rect x="720" y="440" width="260" height="360" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="850" y="490" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="16" font-family="Arial, sans-serif">ENTERPRISE</text>
  <text x="850" y="545" text-anchor="middle" fill="white" font-size="42" font-weight="bold" font-family="Arial, sans-serif">1999</text>
  <text x="850" y="575" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="16" font-family="Arial, sans-serif">MAD / mois</text>
  <line x1="770" y1="600" x2="930" y2="600" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="850" y="635" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="15" font-family="Arial, sans-serif">Tout inclus</text>
  <text x="850" y="665" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="15" font-family="Arial, sans-serif">e-Commerce</text>
  <text x="850" y="695" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="15" font-family="Arial, sans-serif">WhatsApp illimite</text>
  <text x="850" y="725" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="15" font-family="Arial, sans-serif">Support dedie</text>
  <text x="850" y="775" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" font-style="italic" font-family="Arial, sans-serif">Pour les ambitieux</text>

  <!-- Bottom CTA -->
  <text x="540" y="910" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial, sans-serif">Essai gratuit 14 jours — sans carte bancaire</text>
  <text x="540" y="950" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="18" font-family="Arial, sans-serif">o3app.ma</text>

  <rect x="0" y="1074" width="1080" height="6" fill="#f59e0b"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="200" fill="rgba(255,255,255,0.05)"/>
  <circle cx="150" cy="530" r="150" fill="rgba(255,255,255,0.05)"/>

  <!-- Logo circle -->
  <circle cx="120" cy="80" r="40" fill="white"/>
  <text x="120" y="94" text-anchor="middle" fill="#2563eb" font-size="32" font-weight="bold" font-family="Arial, sans-serif">O3</text>

  <!-- Main title -->
  <text x="100" y="250" fill="white" font-size="62" font-weight="bold" font-family="Arial, sans-serif">Gérez votre entreprise</text>
  <text x="100" y="325" fill="#93c5fd" font-size="62" font-weight="bold" font-family="Arial, sans-serif">simplement.</text>

  <!-- Subtitle -->
  <text x="100" y="400" fill="rgba(255,255,255,0.85)" font-size="26" font-family="Arial, sans-serif">Ventes  ·  Achats  ·  Stock  ·  POS  ·  Facturation</text>

  <!-- Badge -->
  <rect x="100" y="440" width="320" height="44" rx="22" fill="rgba(255,255,255,0.15)"/>
  <text x="260" y="468" text-anchor="middle" fill="white" font-size="18" font-family="Arial, sans-serif">ERP Cloud 100% Marocain</text>

  <!-- CTA -->
  <rect x="100" y="510" width="340" height="56" rx="12" fill="#f59e0b"/>
  <text x="270" y="546" text-anchor="middle" fill="#1e3a8a" font-size="22" font-weight="bold" font-family="Arial, sans-serif">Essai gratuit — 14 jours</text>

  <!-- Feature icons row -->
  <text x="700" y="520" fill="rgba(255,255,255,0.6)" font-size="16" font-family="Arial, sans-serif">o3app.ma</text>

  <!-- Price badge -->
  <rect x="830" y="440" width="260" height="100" rx="12" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="960" y="475" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="16" font-family="Arial, sans-serif">A partir de</text>
  <text x="960" y="520" text-anchor="middle" fill="white" font-size="36" font-weight="bold" font-family="Arial, sans-serif">499 MAD/mois</text>
</svg>
